name: CI

# Build, clippy, and the Lockstep Set duplicate guard (ADR-0011, ADR-0012).
# Host tests join here once a host-side crate exists.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TARGET: riscv32imac-unknown-none-elf

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Native tools for openthread-sys, in case it builds OpenThread from
      # source instead of using its prebuilt library.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build clang libclang-dev

      # Installs what rust-toolchain.toml asks for (stable + rust-src, clippy, target).
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # --locked: fail when Cargo.lock is out of sync with the manifests
      # (for example a Renovate PR whose lockfile update failed).
      - name: Clippy
        run: cargo clippy --workspace --locked --target "$TARGET" -- -D warnings

      # Clippy doesn't link; the build catches linker-level breakage.
      - name: Build
        run: cargo build --workspace --locked --release --target "$TARGET"

      # Cargo resolves semver-incompatible versions of a crate side by side, so a
      # Lockstep Set crate in two versions builds fine until the types meet.
      # The graph has legitimate duplicates elsewhere (embassy-sync, heapless),
      # so only these crates must appear exactly once.
      # BLE meets at bt-hci-transport, not bt-hci: esp-radio 1.0.0-beta.1 hands
      # trouble-host a bt_hci_transport::Transport, and still pulls bt-hci 0.9
      # for a legacy impl nothing here uses, next to trouble-host's bt-hci 0.10.
      - name: Lockstep Set duplicate guard
        run: |
          dups=$(cargo tree --workspace --locked --target "$TARGET" -e normal -d --depth 0 --prefix none \
                   | awk 'NF {print $1}' | sort | uniq -d \
                   | grep -E '^(bt-hci-transport|trouble-host|esp-[a-z0-9-]+|rs-matter[a-z0-9-]*|openthread(-sys)?|embassy-executor)$' || true)
          if [ -n "$dups" ]; then
            echo "::error::Lockstep Set crates in more than one version: $(echo $dups)"
            for d in $dups; do cargo tree --workspace --locked --target "$TARGET" -e normal -i "$d"; done
            exit 1
          fi
          echo "No Lockstep Set duplicates."
