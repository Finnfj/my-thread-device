name: CI

# Format, build, clippy, host tests, and the Lockstep Set duplicate guard
# (ADR-0011, ADR-0012). The on-device tests are built and linted here but
# never run: they need a Test Board (`cargo xtask hil`, run locally).

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TARGET: riscv32imac-unknown-none-elf

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ADR claims about what a dependency can do carry a "(checked in ...)"
      # marker; this fails when one no longer matches Cargo.lock. Needs no
      # toolchain, so it runs first.
      - name: ADR version guard
        run: bash scripts/adr-version-guard.sh

      # scripts/flash.sh must refuse to espflash an on-device test binary
      # (a plain `cargo test`); needs no toolchain or Board.
      - name: flash.sh guard
        run: bash scripts/test-flash-guard.sh

      # Native tools for openthread-sys, in case it builds OpenThread from
      # source instead of using its prebuilt library.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build clang libclang-dev

      # Installs what rust-toolchain.toml asks for (stable + rust-src, clippy, rustfmt, target).
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # xtask is its own workspace (it builds for the host), so --all skips it.
      - name: Format
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path xtask/Cargo.toml --check

      # --locked: fail when Cargo.lock is out of sync with the manifests
      # (for example a Renovate PR whose lockfile update failed).
      - name: Clippy
        run: cargo clippy --workspace --locked --target "$TARGET" -- -D warnings

      - name: Clippy (on-device tests)
        run: cargo clippy --package platform --tests --locked --target "$TARGET" -- -D warnings

      # Clippy doesn't link; the build catches linker-level breakage.
      - name: Build
        run: cargo build --workspace --locked --release --target "$TARGET"

      # Links the test binary that `cargo xtask hil` flashes; runs nothing.
      - name: Build on-device tests
        run: cargo test --package platform --lib --no-run --locked --target "$TARGET"

      - name: xtask (clippy, host tests)
        run: |
          cargo clippy --manifest-path xtask/Cargo.toml --locked --target host-tuple --all-targets -- -D warnings
          cargo test --manifest-path xtask/Cargo.toml --locked --target host-tuple

      # The crates whose types cross between Lockstep Set crates must appear
      # exactly once; the script explains why and holds the list.
      - name: Lockstep Set duplicate guard
        run: bash scripts/lockstep-guard.sh
