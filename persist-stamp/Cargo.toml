[package]
name                   = "persist-stamp"
description            = "The Firmware ID and format version stored with Persisted State, and the boot-time decision whether a Factory Reset is due (ADR 0009)."
edition.workspace      = true
rust-version.workspace = true
version.workspace      = true
license.workspace      = true
