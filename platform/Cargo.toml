[package]
name                   = "platform"
description            = "Shared foundation for every Firmware: Matter stack set-up, and later Persisted State, Device Identity and Power Mode."
edition.workspace      = true
rust-version.workspace = true
version.workspace      = true
license.workspace      = true
publish                = false

[dependencies]
esp-hal                = { workspace = true }
esp-rtos               = { workspace = true }
esp-alloc              = { workspace = true }
esp-backtrace          = { workspace = true }
esp-println            = { workspace = true }
esp-radio              = { workspace = true }
esp-storage            = { workspace = true }
esp-metadata-generated = { workspace = true }
embassy-futures        = { workspace = true }
rs-matter-embassy      = { workspace = true }
tinyrlibc              = { workspace = true }
log                    = { workspace = true }
static_cell            = { workspace = true }
embassy-time           = { workspace = true, optional = true }

[features]
# Spike, off by default: start esp-rtos with its automatic light-sleep idle
# hook and log a light-sleep report every 10 s, to answer open questions 1-2
# of docs/research/battery-sensor-esphome-vs-no-std.md on the Test Board.
# Takes LPWR and TIMG1 in PlatformPeripherals.
light-sleep = ["dep:embassy-time"]
