[package]
name                   = "platform"
description            = "Shared foundation for every Firmware: Matter stack set-up and Persisted State, and later Device Identity and Power Mode."
edition.workspace      = true
rust-version.workspace = true
version.workspace      = true
license.workspace      = true
publish                = false

# The on-device tests (ADR 0011) are this crate's unit tests, so that they can
# reach its private modules; embedded-test brings the test harness.
[lib]
harness = false

[dependencies]
esp-hal                = { workspace = true }
esp-rtos               = { workspace = true }
esp-alloc              = { workspace = true }
esp-println            = { workspace = true }
esp-radio              = { workspace = true }
esp-storage            = { workspace = true }
embedded-storage       = { workspace = true }
persist-stamp          = { workspace = true }
esp-bootloader-esp-idf = { workspace = true }
esp-metadata-generated = { workspace = true }
embassy-futures        = { workspace = true }
embassy-embedded-hal   = { workspace = true }
rs-matter-embassy      = { workspace = true }
# Only to select the chip on it, see the workspace manifest.
openthread-driver-esp  = { workspace = true }
tinyrlibc              = { workspace = true }
log                    = { workspace = true }
static_cell            = { workspace = true }

[dev-dependencies]
embedded-test    = { workspace = true }
# embedded-test's task macro names `embassy_executor` from this crate.
embassy-executor = { workspace = true }
semihosting      = { workspace = true }
embassy-time     = { workspace = true }
