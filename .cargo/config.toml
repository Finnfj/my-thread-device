[target.riscv32imac-unknown-none-elf]
runner = "espflash flash --monitor --chip esp32c6"

[env]
# Log filter for esp-println's logger, read when esp-println is built (so a
# change needs a rebuild, not just a reflash). Global level `debug`, with caps
# on the targets that print Thread or Matter secrets at higher levels:
#
# - `rs_matter_embassy::ot=warn`: logs the full Active Operational Dataset,
#   network key included, at INFO on every Thread connect.
# - `rs_matter::im=info`: dumps every Interaction Model request at DEBUG,
#   octet strings in full, so AddOrUpdateThreadNetwork prints the dataset and
#   AddNOC prints the fabric's IPK.
#
# Don't raise the global level to `trace` either: rs-matter then prints
# decrypted packet payloads and openthread prints stored settings, both of
# which carry the same keys. `force` makes this win over an `ESP_LOG` set in
# your shell, so a stray `ESP_LOG=debug` can't bring the leaks back.
ESP_LOG = { value = "debug,rs_matter_embassy::ot=warn,rs_matter::im=info", force = true }
# Force Ninja generator so CMake uses CMAKE_C_COMPILER=clang (set by openthread-sys)
# instead of defaulting to the Visual Studio generator (which ignores CMAKE_C_COMPILER
# and always invokes MSVC, breaking the cross-compile sysroot headers).
CMAKE_GENERATOR = "Ninja"

[build]
rustflags = [
  # Required to obtain backtraces (e.g. when using the "esp-backtrace" crate.)
  # NOTE: May negatively impact performance of produced code
  "-C", "force-frame-pointers",
]

# Every Firmware and the Platform build for the ESP32-C6 by default. Host-side
# crates (tests of pure logic, xtask) opt out per invocation with
# `--target host-tuple` (works on the pinned stable cargo).
target = "riscv32imac-unknown-none-elf"

[unstable]
build-std = ["alloc", "core"]
