[workspace]
resolver = "3"
members  = ["platform", "persist-stamp", "firmware/on-off-light"]
# The host-side dev tool: its own workspace, so that `--workspace` builds for
# the ESP32-C6 never try to compile it (`cargo xtask`, see .cargo/config.toml).
exclude  = ["xtask"]
# `cargo build` / `cargo run` at the root build and flash the light.
default-members = ["firmware/on-off-light"]

[workspace.package]
edition      = "2024"
rust-version = "1.92"
version      = "0.1.0"
license      = "MIT OR Apache-2.0"

[workspace.dependencies]
platform      = { path = "platform" }
persist-stamp = { path = "persist-stamp" }

# ESP-HAL — log-04 instead of defmt
esp-hal = { version = "~1.2.3", features = ["log-04", "esp32c6", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "esp-radio",
  "embassy",
  "esp32c6",
] }

esp-bootloader-esp-idf  = { version = "0.6.0", features = ["log-04", "esp32c6"] }
esp-alloc               = "0.11.0"
# Each Firmware turns on `panic-handler` itself: the on-device tests (ADR 0011)
# link the Platform with embedded-test's panic handler instead.
esp-backtrace           = { version = "0.20", features = ["println", "esp32c6"] }
esp-println             = { version = "0.18.0", features = ["log-04", "esp32c6"] }
# IEEE 802.15.4 + BLE radio (Thread commissioning + operation)
# A pre-release on purpose (ADR-0012): 1.0.0-beta.1 is the first esp-radio on
# crates.io whose BLE connector implements bt-hci-transport, the transport
# trait that rs-matter-embassy's bt-hci 0.10 / trouble-host 0.8 accept.
# 1.0.0-beta.2 is yanked.
esp-radio              = { version = "1.0.0-beta.1", features = ["ble", "log-04", "unstable", "esp32c6"] }
# Flash access for Persisted State; `embedded-storage` gives FlashStorage the
# NorFlash traits that sequential-storage (under SeqMapKvBlobStore) needs.
esp-storage             = { version = "0.10", features = ["embedded-storage", "esp32c6"] }
# The NorFlash traits themselves: the Platform forwards them through a borrowed
# FlashStorage to read the stamp before it decides on a Factory Reset.
embedded-storage        = "0.3"
# Provides the memory_range! macro for reclaimed-RAM calculation
esp-metadata-generated  = "0.5"

# Embassy
embassy-executor = "0.10.0"
embassy-sync     = "0.8"
embassy-futures  = "0.1"
# BlockingAsync: the async NorFlash view of esp-storage that SeqMapKvBlobStore takes
embassy-embedded-hal = "0.6"

# Matter over Thread stack (git: rs-matter-embassy is not on crates.io).
# At d9456b8, upstream's HEAD and its first commit on crates.io rs-matter 0.5
# and openthread 0.5. Its root Cargo.toml also patches esp-hal, esp-radio and
# the embassy-net crates to git, for its Wi-Fi and Ethernet `embassy-net`
# feature, which we leave off: our features build against the crates.io esp-*
# above, and the embassy patch below is all the lockfile needs.
# Unpin when: a rs-matter-embassy release is on crates.io.
rs-matter-embassy = { git = "https://github.com/sysgrok/rs-matter-embassy", rev = "d9456b8f61e1c3c38c1538c776ff874590364b12", features = [
  "esp-thread",
  "log",
  "openthread-heap-int-8192",
] }
# The ESP32-C6 IEEE 802.15.4 radio driver under OpenThread. Listed only to pick
# the chip, which rs-matter-embassy's `esp-thread` cannot do.
openthread-driver-esp = { version = "0.1", features = ["esp32c6"] }
# C stdlib polyfill for OpenThread's pre-compiled library (str*, utoa, etc.)
tinyrlibc = { version = "0.5", default-features = false, features = ["memchr", "utoa", "strtoul"] }

log = "0.4"

static_cell = "2.1.1"

# On-device tests (ADR 0011), run by `cargo xtask hil` through probe-rs.
# `external-executor` + `embassy-010`: async tests run on esp-rtos's executor,
# as in esp-hal's own hardware tests. `log`: test and panic messages go
# through the `log` crate, which the tests print over semihosting.
embedded-test = { version = "0.7.3", features = ["embassy-010", "external-executor", "log"] }
# Host-side stdout for the tests' logger (probe-rs prints it).
semihosting   = { version = "0.1", features = ["stdio"] }
embassy-time  = "0.5"

# Only for resolving the lockfile, which takes in rs-matter-embassy's optional
# dependencies too: its `embassy-net` feature (off here) names the `ipv4`
# feature, which only embassy-net on embassy main has. That embassy-net brings
# embassy main's embassy-time, whose embassy-time-driver may be in the lockfile
# only once (`links`), so that one is patched too. Of the two, only
# embassy-time-driver is built: it is crates.io 0.2.2 plus tick-rate constants.
# Leave embassy-time, embassy-time-queue-utils and embassy-executor on
# crates.io: patching queue-utils pulls in a second embassy-executor-timer-queue
# (see SEAM_CRATES in scripts/lockstep-guard.sh), and embassy main's
# embassy-embedded-hal needs nightly.
# Drop the patch when: an embassy-net release on crates.io has the `ipv4`
# feature.
[patch.crates-io]
embassy-net         = { git = "https://github.com/embassy-rs/embassy", rev = "153b9b2cb44f7bdc4ea3b3af85eb31b8950624f3" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy", rev = "153b9b2cb44f7bdc4ea3b3af85eb31b8950624f3" }

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# Always build with some optimisations — the default debug profile is too slow
# for the radio/crypto workloads on a constrained device.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimisations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
