[workspace]
resolver = "3"
members  = ["platform", "firmware/on-off-light"]
# `cargo build` / `cargo run` at the root build and flash the light.
default-members = ["firmware/on-off-light"]

[workspace.package]
edition      = "2024"
rust-version = "1.88"
version      = "0.1.0"
license      = "MIT OR Apache-2.0"

[workspace.dependencies]
platform = { path = "platform" }

# ESP-HAL — log-04 instead of defmt
esp-hal = { version = "~1.2.0", features = ["log-04", "esp32c6", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "esp-radio",
  "embassy",
  "esp32c6",
] }

esp-bootloader-esp-idf  = { version = "0.6.0", features = ["log-04", "esp32c6"] }
esp-alloc               = "0.11.0"
esp-backtrace           = { version = "0.20", features = ["panic-handler", "println", "esp32c6"] }
esp-println             = { version = "0.18.0", features = ["log-04", "esp32c6"] }
# IEEE 802.15.4 + BLE radio (Thread commissioning + operation)
# A pre-release on purpose (ADR-0012): 1.0.0-beta.1 is the first esp-radio on
# crates.io whose BLE connector implements bt-hci-transport, the transport
# trait that rs-matter-embassy's bt-hci 0.10 / trouble-host 0.8 accept.
# 1.0.0-beta.2 is yanked.
esp-radio              = { version = "1.0.0-beta.1", features = ["ble", "log-04", "unstable", "esp32c6"] }
# Flash storage (needed transitively by the Matter stack)
esp-storage             = { version = "0.10", features = ["esp32c6"] }
# Provides the memory_range! macro for reclaimed-RAM calculation
esp-metadata-generated  = "0.5"

# Embassy
embassy-executor = "0.10.0"
embassy-sync     = "0.8"
embassy-futures  = "0.1"

# Matter over Thread stack (git — not yet published to crates.io)
# Pinned to "Update to esp-radio beta 1" (2a806b0): every later commit needs
# unreleased rs-matter / rs-matter-stack from git, which would mean patching
# those into the Lockstep Set too.
# Unpin when: rs-matter-embassy HEAD builds against crates.io rs-matter,
# i.e. its root Cargo.toml no longer patches rs-matter or rs-matter-stack.
rs-matter-embassy = { git = "https://github.com/sysgrok/rs-matter-embassy", rev = "2a806b0b1b521293b34a773618499e87402c843c", features = [
  "esp",
  "log",
  "openthread",
  "openthread-heap-int-8192",
] }
# C stdlib polyfill for OpenThread's pre-compiled library (str*, utoa, etc.)
tinyrlibc = { version = "0.5", default-features = false, features = ["memchr", "utoa", "strtoul"] }

log = "0.4"

static_cell = "2.1.1"

# Patch openthread + openthread-sys to git for commit 679dc18, the fix for a
# refcount underflow in OpenThread::new_with_udp_srp, the constructor
# rs-matter-embassy uses: without it, dropping the Thread stack (for example
# for a Factory Reset) panics when overflow checks are on. crates.io
# openthread 0.4.0 already has the internal-MbedTLS fix (ad3d8f3) this patch
# was first added for, and accepts esp-radio 1.0.0-beta.1.
# Pinned to ac97457, the last commit before CSL support (705c557) added a
# RadioCaps argument to new_with_udp_srp: the rs-matter-embassy commit above
# still calls the old signature, while its later commits call the new one.
# Unpin when: the rs-matter-embassy pin above is lifted (move rev to HEAD).
# Drop the patch when: an openthread release on crates.io contains 679dc18.
[patch.crates-io]
openthread     = { git = "https://github.com/esp-rs/openthread", rev = "ac97457efc5debb4256bcd3013d4ddbe1ff804f4" }
openthread-sys = { git = "https://github.com/esp-rs/openthread", rev = "ac97457efc5debb4256bcd3013d4ddbe1ff804f4" }

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# Always build with some optimisations — the default debug profile is too slow
# for the radio/crypto workloads on a constrained device.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimisations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
